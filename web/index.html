<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>onedse - quantum mechanics in phase space</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>onedse</h1>
        <span class="tagline">quantum mechanics in phase space</span>
        <span class="spacer"></span>
        <button id="theme" class="ghost" title="Toggle light / dark">Theme</button>
    </header>

    <div class="layout">
        <nav id="examples" aria-label="Examples"></nav>

        <main>
            <section class="intro">
                <h2 id="title">Loading...</h2>
                <p id="description"></p>
            </section>

            <section class="editor">
                <div class="toolbar">
                    <button id="run" class="primary" title="Ctrl/Cmd + Enter">Run</button>
                    <button id="stop" disabled>Stop</button>
                    <button id="reset" class="ghost" title="Discard your changes to this example">Reset script</button>
                    <span id="status" role="status"></span>
                    <span class="spacer"></span>
                    <button id="toggle-editor" class="ghost">Hide script</button>
                </div>
                <textarea id="code" spellcheck="false" autocomplete="off" autocapitalize="off" aria-label="Lua script"></textarea>
                <pre id="console" hidden></pre>
            </section>

            <section class="transport" id="transport" hidden>
                <button id="play" title="Play / pause (Space)">Play</button>
                <button id="prev" class="ghost step" title="Previous frame (Left arrow)" aria-label="Previous frame">&#9664;</button>
                <button id="next" class="ghost step" title="Next frame (Right arrow)" aria-label="Next frame">&#9654;</button>
                <input id="slider" type="range" min="0" max="0" value="0" step="1" aria-label="Frame">
                <span id="frame-label"></span>
                <label>Speed
                    <select id="speed" title="Frames per second">
                        <option value="3">3 fps</option>
                        <option value="6">6 fps</option>
                        <option value="12" selected>12 fps</option>
                        <option value="24">24 fps</option>
                        <option value="48">48 fps</option>
                    </select>
                </label>
                <label class="check" title="Start over when the end is reached"><input id="loop" type="checkbox" checked> Loop</label>
            </section>

            <section id="panels" class="panels"></section>
        </main>
    </div>

    <div id="tooltip" class="tooltip" hidden></div>
    <script type="module" src="app.js"></script>
</body>
</html>
